name: ImusHellGear
version: '${project.version}'
main: me.imu.imushellgear.ImusHellGear
api-version: '26.2'
authors: [ imu ]
description: Hell and Void armor and tools, Hell arrows, legendary upgrades, Void stones, Void Totem, Reinforced Iron Armor
depend:
  - imusAPI
softdepend:
  - ImusEnchants
commands:
  imushellgear:
    description: ImusHellGear's permissions menu
    usage: /<command> perms
    aliases: [hellgear]
permissions:
  imushellgear.config:
    level: very_high
    description: Change the settings with /ia config imushellgear
    default: op
