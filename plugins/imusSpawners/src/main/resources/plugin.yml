name: ImusSpawners
author: imu
version: 2.0
main: imu.spawners.ImusSpawners
description: Spawners with silk touch on a lucky roll that gets likelier with every miss
api-version: '26.2'
depend: [imusAPI]
commands:
  spawners:
    description: Your chance of getting a spawner, and admin commands
    usage: /<command> | give <mob> [player] [amount] | stats <player>
    aliases: [imusspawners]
permissions:
  imusspawners.admin:
    level: high
    description: Give spawners, see anyone's chance, change the settings
    default: op
