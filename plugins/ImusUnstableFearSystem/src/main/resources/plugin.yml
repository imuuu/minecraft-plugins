name: ImusUnstableFearSystem
version: '${project.version}'
main: me.imu.imusunstablefearsystem.ImusUnstableFearSystem
api-version: '26.2'
authors: [ imu ]
description: FEAR or NO_FEAR difficulty, the nether fear system, the Unstable End events and their loot
depend:
  - imusAPI
  - ImusHellGear
softdepend:
  - BetterStructures
commands:
  imusunstablefearsystem:
    description: ImusUnstableFearSystem's permissions menu
    usage: /<command> perms
    aliases: [unstablefear, fear]
permissions:
  imusunstablefearsystem.config:
    level: very_high
    description: Change the settings with /ia config imusunstablefearsystem
    default: op
