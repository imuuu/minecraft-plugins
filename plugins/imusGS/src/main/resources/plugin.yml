name: imusGS
author: imu
version: 2.0
main: imu.GS.ImusGS
api-version: '26.2'
description: General stores that buy and sell items
depend: [imusAPI]
softdepend: [Vault]
commands:
   gs:
     description: imusGS shop commands
     usage: /<command>
   g:
     description: Check what your items are worth
     usage: /<command> getprice <hand|hotbar|inventory>
   gsopenfor:
     description: Open a shop for a player. For command NPCs and the console.
     usage: /<command> <player> <shop name>
     permission: gs.openfor
permissions:
   gs.admin:
     level: very_high
     description: Every imusGS admin command
     default: op
     children:
       gs.create.shop: true
       gs.open.shop: true
       gs.openfor: true
       gs.add: true
       gs.create.uniques: true
       gs.modify.uniques: true
       gs.modify.shop: true
       gs.modify.enchants: true
       gs.set.material.price: true
       gs.set.material.overflow: true
       gs.unset.material.overflow: true
       gs.set.material.smart_price: true
       gs.unset.material.smart_price: true
       gs.tag: true
       gs.config: true
       gs.tabcompleter: true
       gs.create.npc: true
       gs.profile: true
       gs.limits: true
       gs.flash: true
       gs.peek: true
       gs.stats: true
       gs.remove.shop: true
       ia.npc.edit: true
   gs.create.shop:
     level: high
     description: /gs create shop
     default: op
   gs.open.shop:
     level: medium
     description: /gs open shop, open any shop anywhere. Players normally open shops through an NPC instead.
     default: op
   gs.openfor:
     level: high
     description: /gsopenfor, open a shop for another player
     default: op
   gs.add:
     level: high
     description: /gs add, add stockable items to a shop
     default: op
   gs.create.uniques:
     level: high
     description: /gs create unique
     default: op
   gs.modify.uniques:
     level: high
     description: /gs modify uniques
     default: op
   gs.modify.shop:
     level: high
     description: /gs modify shop
     default: op
   gs.modify.enchants:
     level: high
     description: /gs modify enchantments
     default: op
   gs.set.material.price:
     level: high
     description: /gs set material price
     default: op
   gs.set.material.overflow:
     level: high
     description: /gs set material overflow
     default: op
   gs.unset.material.overflow:
     level: high
     description: /gs unset material overflow
     default: op
   gs.set.material.smart_price:
     level: high
     description: /gs set material smart_price
     default: op
   gs.unset.material.smart_price:
     level: high
     description: /gs unset material smart_price
     default: op
   gs.tag:
     level: high
     description: /gs tag, tag materials and shop items and change their prices
     default: op
   gs.config:
     level: very_high
     description: /gs config, the in-game settings menu
     default: op
   gs.tabcompleter:
     level: low
     description: Tab completion of /gs
     default: op
   gs.create.npc:
     level: high
     description: /gs create npc, spawn an NPC that opens a shop, and link an NPC to a shop in its settings
     default: op
   gs.profile:
     level: high
     description: /gs profile, price every material with a price profile
     default: op
   gs.limits:
     level: high
     description: /gs limits and /gs reset limits, see and reset a shop's sell limits
     default: op
   gs.flash:
     level: high
     description: /gs flash start|end, /gs wanted start|end and /gs restock, start live events by hand
     default: op
   gs.remove.shop:
     level: high
     description: /gs remove shop <name> confirm, remove a shop and its NPCs
     default: op
   gs.stats:
     level: medium
     description: /gs stats [days] [shop], where the money went and what live events are doing
     default: op
   gs.peek:
     level: low
     description: /gs peek, a look at a few flash deals from anywhere
     default: true
