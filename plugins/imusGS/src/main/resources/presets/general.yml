# imusGS shop preset: General Store. /gs create preset general makes a shop of it with its NPC where you stand,
# /gs village makes every preset at once. Edit this file to change what new shops of it get; shops made
# already keep their stock, but their live events (rotation, flash deals, found items) follow this file.
#
# name, display-name   the shop's name and how players see it
# buy-only             players can only buy here
# npc                  the villager: profession, one of the names, and a title after it
# tags                 material tags (see the price profile) the shop is about: its rotating stock and flash
#                      deals come from these
# found-tags           items of these tags that players find turn up here (default: the same as tags)
# quality              over 1 brings rarer, pricier items more often
# rotation             how many kinds of items come every rotation, and the share of enchanted gear
# books                rotating stock and flash deals are enchanted books
# custom-books         ...books of other plugins' custom enchants (ImusEnchants), level I
# flash                flash deals: share of enchanted gear, fun items (TNT...), rare specials (totems...)
# gear                 gear this shop enchants and sells (default: the flash deal gear of config.yml)
# stock                what the shop always has: at most max, fill more every minutes; an item can be a
#                      custom item of another plugin by its id (see /gs customprices)

name: General Store
display-name: "&6&lGeneral Store"
buy-only: false
npc:
  profession: cartographer
  names: [Alfred, Martha, Otto, Greta, Hugo]
  title: "&7the Shopkeeper"
tags: []
quality: 1
rotation:
  items-min: 2
  items-max: 4
  gear-share: 0
books: false
flash:
  gear-share: 0.4
  fun: true
  specials: true
