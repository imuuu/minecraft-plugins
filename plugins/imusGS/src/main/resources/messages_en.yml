# imusGS texts players see. Pick the file with "language" in config.yml (en = this file, fi = messages_fi.yml).
# To make your own language, copy this file to messages_<code>.yml and set language: <code>.
#
# & colour codes work, and {placeholders} are filled in. A text set to "" isn't sent at all.
# A text missing from this file comes from the plugin's own copy, so new texts of an update work right away.
# Admin menus and commands aren't here; they stay in English.

