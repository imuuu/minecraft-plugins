# imusGS settings. The database connection is in DataBaseSettings.yml.
# Every value here can be changed in game with /gs config (or /ia config).

shop:
  # How often shops refill stockable items and check for expiring stock, in seconds
  check-interval-seconds: 20
  # A shop is saved to the database this many seconds after its last customer leaves.
  # Shops are always saved on shutdown too.
  save-delay-seconds: 10
  # Shortest time between two clicks in the shop menu, in seconds
  click-cooldown-seconds: 0.2
  # Players may sell items the shop pays nothing for (price 0), to empty their inventory quickly.
  # They get nothing, and the items go into the shop. false = such items stay with the player.
  allow-zero-price-sells: true
  # Every trade is logged in the gs_trades table; rows older than this many days are deleted on start.
  # 0 = keep them forever
  trade-log-days: 90

pricing:
  # Damaged tools and armor are worth (durability left - penalty) of their price.
  # 0.1 = an item at 80% durability sells for 70% of the full price. A brand new item has no penalty.
  durability-penalty: 0.1
  # On the first start, while no material has a price yet, price every material with this profile from
  # plugins/imusGS/profiles (see /gs profile). Empty = start with every price at 0.
  first-start-profile: default
  # What diamond costs with that profile; everything else is scaled to match
  first-start-diamond-price: 1000

# Values a newly created shop starts with. Existing shops keep their own, change those with /gs modify shop
new-shop:
  # Players buy from the shop for item price * this
  sell-multiplier: 5.0
  # Players sell to the shop for item price * this
  buy-multiplier: 1.0
  # Share of the shop's stock that disappears every expire cooldown, 0.1 = 10%. Stockable items never expire.
  expire-percent: 0.1
  expire-cooldown-minutes: 60

# Live events make a shop feel alive. Each part can be turned off here, and each shop has its own
# "Live Events" switch in /gs modify shop.
live:
  # Now and then something players gather (mine, farm, kill, fish) also turns up in a shop. The rarer the item,
  # the rarer it is: chance = base-chance / sqrt(1 + price / value-scale). With the defaults cobblestone turns up
  # about 1 in 170, iron ore 1 in 700 and diamond 1 in 2 400. Blocks players placed themselves don't count
  # (grown crops do).
  found-items:
    enabled: true
    base-chance: 0.006
    value-scale: 5
    # A shop never gets more found items of one kind than this
    max-per-item: 64
    mining: true
    mobs: true
    fishing: true
  # Every interval a few random items of these material tags come to the shop, about budget worth of each.
  # Rarer items come less often. Normal expiry takes them away again over time.
  rotation:
    enabled: true
    interval-minutes: 180
    items-min: 3
    items-max: 6
    budget: 2000
    value-scale: 5
    tags: [stone, earth, wood, farming, food, decoration, ores, minerals, nether, end, ocean, redstone, mob_drops]
  # Limited time offers. Players are told only that deals are on, with a [Peek] at a couple of them.
  # Items bought from a deal can't be sold back to a shop.
  flash-deals:
    enabled: true
    # A deal starts at a random time this many minutes after the last one
    interval-minutes-min: 120
    interval-minutes-max: 300
    duration-minutes: 20
    offers-min: 4
    offers-max: 7
    # Percent off the normal price. Never so cheap that selling the item back would pay.
    discount-min: 20
    discount-max: 50
    # How many offers are peeked
    peek-offers: 2
    # Share of offers that are enchanted gear; the rest are blocks and items of the rotation tags
    gear-share: 0.4
    gear-stock-min: 2
    gear-stock-max: 5
    gear-player-limit: 2
    # Enchants of gear can go a level or two over the normal max with this chance, per enchant
    over-max-level-chance: 0.15
    gear-enchants-min: 2
    gear-enchants-max: 5
    gear: [DIAMOND_SWORD, DIAMOND_PICKAXE, DIAMOND_AXE, DIAMOND_SHOVEL, DIAMOND_HELMET, DIAMOND_CHESTPLATE,
           DIAMOND_LEGGINGS, DIAMOND_BOOTS, NETHERITE_SWORD, NETHERITE_PICKAXE, NETHERITE_AXE, NETHERITE_HELMET,
           NETHERITE_CHESTPLATE, NETHERITE_LEGGINGS, NETHERITE_BOOTS, BOW, CROSSBOW, TRIDENT, MACE, FISHING_ROD,
           ELYTRA, SHIELD]
    # Now and then a rare item instead of gear
    special-chance: 0.2
    special-items: [TOTEM_OF_UNDYING, ENCHANTED_GOLDEN_APPLE, NETHER_STAR, HEART_OF_THE_SEA, SHULKER_SHELL,
                    NETHERITE_INGOT, NETHERITE_UPGRADE_SMITHING_TEMPLATE, TRIAL_KEY, OMINOUS_TRIAL_KEY]
    special-stock-min: 2
    special-stock-max: 4
    special-player-limit: 2
    # Blocks and items: this many stacks in stock, and at most this many units per player
    block-stacks-min: 2
    block-stacks-max: 6
    block-player-limit: 128
    tags: [stone, earth, wood, farming, food, decoration, ores, minerals, nether, end, ocean, redstone, mob_drops]
  # Now and then a shop wants a few items for a while and pays a bonus for them. The bonus never makes the
  # shop pay as much as it sells the item for, and sell limits still count.
  wanted:
    enabled: true
    interval-minutes-min: 180
    interval-minutes-max: 360
    duration-minutes: 120
    items-min: 1
    items-max: 2
    # Percent more the shop pays, in steps of 5
    bonus-min: 30
    bonus-max: 80
    value-scale: 5
    tags: [farming, food, mob_drops, wood, ores, minerals, ocean, nether, stone, earth]
  # Every day each kind of item is a little up or down in price, for buying and selling alike. An item follows
  # the first tag of this list it has. The day's moods come from the date and the seed, so they are the same
  # all day and after restarts.
  mood:
    enabled: true
    max-percent: 10
    # 0 = picked on the first start, so every server has moods of its own
    seed: 0
    tags: [ores, minerals, farming, food, wood, stone, earth, mob_drops, nether, end, ocean, redstone, decoration,
           tools, armor]
