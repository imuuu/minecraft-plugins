# imusGS price profile: a price for every material, relative to diamond = 1000.
#
# Apply it with   /gs profile apply default [diamond price] confirm
# e.g. "/gs profile apply default 500 confirm" makes diamond 500 and scales everything else to match.
# Applying replaces the price, tags and sell limits of every material (overflow settings stay).
#
# A material's price comes from, in this order:
#   1. its exact name below
#   2. the most specific wildcard (*) below that matches it (the one with the most letters)
#   3. its crafting recipe: the ingredients' prices x crafted-multiplier
#      (planks from logs, tools from ingots and sticks, blocks from ingots...)
#   4. default-price
# So only raw resources and things a recipe can't price need to be listed. Prices of 0 can't be sold.
#
# imusGS rewrites this file on every start, so edits here are lost: copy it to make your own profile
# (e.g. profiles/myserver.yml); it shows up in /gs profile list.

reference-price: 1000      # what DIAMOND costs below
crafted-multiplier: 1.1    # crafting adds 10% to the ingredients' worth
default-price: 1           # anything not listed and without a crafting recipe

