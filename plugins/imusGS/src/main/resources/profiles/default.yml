# Sell limits stop farms from paying without end. Each shop buys a group's worth of items at the full price up to
# its allowance; past that the price drops evenly, down to min-percent of the full price at twice the allowance.
# The allowance comes back over time (refill-per-hour). The limit belongs to the shop and every seller shares it,
# so farmers compete over it, and selling elsewhere is fine.
#
# allowance and refill-per-hour are money at diamond = 1000, scaled with the diamond price like the prices above.
# Crafted items count by their value against the group of their most valuable ingredient: hay bales and bread
# against crops, iron blocks and tools against iron. Anything in no group (diamonds, netherite...) has no limit.
#
# For scale: mining diamonds pays about 30 000 an hour. Farming crops pays a little less: a shop takes about
# 1 500 wheat (24 000) at the full price and 1 500 more every hour.
sell-limits:
  crops:
    allowance: 24000
    refill-per-hour: 24000
    min-percent: 20
    items: [WHEAT, "*_SEEDS", CARROT, POTATO, POISONOUS_POTATO, BEETROOT, MELON_SLICE, MELON, PUMPKIN, SUGAR_CANE,
            CACTUS, COCOA_BEANS, NETHER_WART, SWEET_BERRIES, GLOW_BERRIES, KELP, DRIED_KELP, APPLE, BAKED_POTATO,
            "*_MUSHROOM", CHORUS_FRUIT, PITCHER_POD, HAY_BLOCK]
  animals:
    allowance: 18000
    refill-per-hour: 18000
    min-percent: 20
    items: [BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT, COD, SALMON, TROPICAL_FISH, PUFFERFISH, "COOKED_*", LEATHER,
            FEATHER, EGG, BROWN_EGG, BLUE_EGG, "*_WOOL", RABBIT_HIDE, INK_SAC, HONEYCOMB, HONEY_BOTTLE, MILK_BUCKET]
  mob_drops:
    allowance: 20000
    refill-per-hour: 15000
    min-percent: 20
    items: [STRING, BONE, BONE_MEAL, ROTTEN_FLESH, SPIDER_EYE, GUNPOWDER, ENDER_PEARL, BLAZE_ROD, BREEZE_ROD,
            GHAST_TEAR, SLIME_BALL, MAGMA_CREAM, PHANTOM_MEMBRANE, GLOW_INK_SAC, PRISMARINE_SHARD, PRISMARINE_CRYSTALS,
            REDSTONE, GLOWSTONE_DUST, SUGAR, ARROW]
  # About 5 stacks of iron ingots at the full price, and a stack more every 45 minutes
  iron:
    allowance: 25600
    refill-per-hour: 6400
    min-percent: 20
    items: [IRON_INGOT, RAW_IRON, IRON_NUGGET, IRON_ORE, DEEPSLATE_IRON_ORE]
  gold:
    allowance: 30000
    refill-per-hour: 7500
    min-percent: 20
    items: [GOLD_INGOT, RAW_GOLD, GOLD_NUGGET, "*GOLD_ORE"]
  copper:
    allowance: 10000
    refill-per-hour: 4000
    min-percent: 20
    items: [COPPER_INGOT, RAW_COPPER, "*COPPER_ORE"]
  # Villager trading makes emeralds without end
  emerald:
    allowance: 30000
    refill-per-hour: 12000
    min-percent: 20
    items: [EMERALD, "*EMERALD_ORE"]
  wood:
    allowance: 8000
    refill-per-hour: 4000
    min-percent: 20
    items: ["*_LOG", "*_WOOD", "*_STEM", "*_HYPHAE", "STRIPPED_*", BAMBOO, BAMBOO_BLOCK, "*_SAPLING", "*_LEAVES",
            MANGROVE_PROPAGULE]
  stone:
    allowance: 5000
    refill-per-hour: 2500
    min-percent: 20
    items: [STONE, COBBLESTONE, DEEPSLATE, COBBLED_DEEPSLATE, GRANITE, DIORITE, ANDESITE, TUFF, BASALT, BLACKSTONE,
            NETHERRACK, END_STONE, OBSIDIAN, SAND, RED_SAND, GRAVEL, DIRT, MUD, CLAY_BALL, SNOWBALL, ICE]
