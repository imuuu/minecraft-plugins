# imusWaystones settings. Change them in game or from the console with /ia config imuswaystones (list|set <setting> <value>),
# or edit this file and run /waystones reload. The database is set in DataBaseSettings.yml.

structure:
  # A waystone is one of these blocks, any wall on it and any slab on top
  base-blocks:
    - COPPER_BLOCK
    - WAXED_COPPER_BLOCK
    - EXPOSED_COPPER
    - WEATHERED_COPPER
    - OXIDIZED_COPPER
    - WAXED_EXPOSED_COPPER
    - WAXED_WEATHERED_COPPER
    - WAXED_OXIDIZED_COPPER
    - EMERALD_BLOCK
    - IRON_BLOCK
    - GOLD_BLOCK
    - DIAMOND_BLOCK
    - NETHERITE_BLOCK
# Blocks between a player's own waystones (imuswaystones.build-anywhere skips this)
min-distance-between-own: 300
# Blocks from which a waystone's floating name shows
name-view-distance: 20
# Blocks a player may move while the teleport gets ready
cancel-distance: 0.5

teleport:
  # Seconds to stand still before a teleport, and what every Cast Time tier takes off
  cast-seconds: 30
  cast-seconds-per-tier: 3
  min-cast-seconds: 1
  # The cooldown in seconds at each Foundation tier, from no upgrade to the top
  foundation-cooldown-seconds: [5400, 2400, 1500, 60]
  # % of the cooldown every Cooldown tier takes off
  cooldown-percent-per-tier: 5
  # XP levels a teleport costs, and what every XP Usage tier takes off. 0 = teleports are free and
  # the XP Usage upgrade is off
  xp-levels: 0
  xp-levels-per-tier: 1

# What each next tier of an upgrade costs, from tier 0 up: "ITEM:amount ITEM:amount". The list's length is the
# highest tier; an empty list turns the upgrade off.
upgrades:
  cast-time:
    - LAPIS_BLOCK:10
    - LAPIS_BLOCK:20
    - LAPIS_BLOCK:30
    - LAPIS_BLOCK:33
    - LAPIS_BLOCK:40
    - LAPIS_BLOCK:40 DIAMOND:2
    - LAPIS_BLOCK:30 DIAMOND:5
    - LAPIS_BLOCK:20 DIAMOND:10
    - LAPIS_BLOCK:10 DIAMOND:12
  cooldown:
    - DIAMOND:1
    - DIAMOND:6
    - DIAMOND:11
    - DIAMOND:16
    - DIAMOND:21
    - DIAMOND:26
    - DIAMOND:31
    - DIAMOND:36
    - DIAMOND:41
    - DIAMOND:46
  dimension:
    - ENDER_PEARL:8 BLAZE_ROD:16 RED_MUSHROOM:16
    - ENDER_PEARL:10 ENDER_EYE:32 PURPUR_BLOCK:64
  xp-usage:
    - IRON_BLOCK:1
    - IRON_BLOCK:3
    - IRON_BLOCK:5
    - GOLD_BLOCK:1
    - GOLD_BLOCK:5
    - GOLD_BLOCK:10
    - DIAMOND:3
    - IRON_BLOCK:10 GOLD_BLOCK:5 DIAMOND_BLOCK:2
    - GOLD_BLOCK:10 DIAMOND_BLOCK:3
    - GOLD_BLOCK:5 DIAMOND_BLOCK:5 NETHERITE_BLOCK:1
  foundation:
    - GOLD_BLOCK:1
    - DIAMOND_BLOCK:1
    - NETHERITE_BLOCK:1

