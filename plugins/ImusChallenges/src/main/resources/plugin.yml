name: ImusChallenges
version: '${project.version}'
main: me.imu.imuschallenges.ImusChallenges
api-version: '26.2'
authors: [ imukuppikorvaa ]
description: The challanges for drevaria server
depend:
  - imusAPI
softdepend:
  - GadgedMenu
permissions:
  imuschallenges.server.collection.material:
    level: low
    description: Take part in the server wide research of materials (points for the first to collect each one)
    default: not op
  imuschallenges.server.collection.broadcast:
    level: low
    description: Hear what other players research first
    default: not op
  imuschallenges.server.achievement.achievement:
    level: low
    description: Take part in the first advancement race (everyone but ops when points.first-advancement-everyone is on)
    default: false
  imuschallenges.server.achievement.broadcast:
    level: low
    description: Hear who completes an advancement first
    default: false
  imuschallenges.broadcast.leader:
    level: low
    description: Hear when someone takes the lead in challenge points
    default: true
  imuschallenges.broadcast.challengeshop:
    level: low
    description: Hear when the challenge shop gets new items
    default: op
  ic.create.npc:
    level: high
    description: /ic create npc, an NPC that opens the challenge shop
    default: op
  ic.view.points:
    level: medium
    description: /ic view points, see your own or another player's challenge points
    default: op
  ic.view.advancements:
    level: medium
    description: /ic view advancements, see your own or another player's advancements
    default: op
  ic.view.materials:
    level: low
    description: /ic view materials, open the researched materials menu
    default: op
  ic.collection.admin:
    level: high
    description: In the researched materials menu, exclude materials from the research
    default: op
  ic.shop:
    level: medium
    description: /ic shop, open the challenge shop from anywhere
    default: op
  ic.add.points:
    level: high
    description: /ic add points, give challenge points to a player
    default: op
  ic.set.points:
    level: high
    description: /ic set points and /ic set lifetime, set a player's challenge points
    default: op
  ic.reset.points:
    level: high
    description: /ic reset points, reset the points of a player or everyone
    default: op
  ic.reload:
    level: very_high
    description: /ic reload, reload the settings
    default: op
  ic.config:
    level: very_high
    description: /ic config, change the settings in game
    default: op
  ic.tabcompleter:
    level: low
    description: Tab completion for /ic
    default: op
commands:
  imuschallenges:
    description: imusChallenges
    usage: /<command>
    aliases:
      - ic
