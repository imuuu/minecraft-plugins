name: ImusEnchants
version: '${project.version}'
main: me.imu.imusenchants.ImusEnchants
api-version: '26.2'
depend:
  - imusAPI
softdepend:
  - BetterStructures
commands:
  imusenchants:
    description: ImusEnchants help and admin commands
    usage: /<command> help [topic]
    aliases:
      - ien
permissions:
  imusenchants.admin:
    description: "Admin commands: give Slot Cores and custom books, /ien admin menu"
    default: op
