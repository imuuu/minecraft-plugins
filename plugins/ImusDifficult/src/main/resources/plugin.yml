name: ImusDifficult
version: '${project.version}'
main: me.imu.imusdifficult.ImusDifficult
api-version: '26.2'
authors: [ imu ]
description: Survival tweaks - armor wear from poison and fire, harder shulkers, portal opening dates, AFK kick
depend:
  - imusAPI
commands:
  imusdifficult:
    description: ImusDifficult's permissions menu
    usage: /<command> perms
    aliases: [difficult]
permissions:
  imusdifficult.config:
    level: very_high
    description: Change the settings with /ia config imusdifficult
    default: op
