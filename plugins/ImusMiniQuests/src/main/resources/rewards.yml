# Shared random rewards. Every quest rolls random-rewards.rolls-per-quest (config.yml) of these
# on top of its own rewards in quests.yml; a quest can set its own count with
# rewards.random-rolls.
#
# A roll first picks a tier by the tiers' weights, then a reward of that tier by the rewards'
# weights. With the weights below (1000 in total) a roll is common 60%, uncommon 25%,
# rare 11%, epic 3.3% and legendary 0.7%. Luck from quest points makes the rare tiers and the
# rare rewards inside a tier likelier, and amounts lean towards their maximum.
#
# display    the tier's name in messages and the panel lore
# weight     how often this tier is picked
# announce   tell the whole server when someone gets a reward from this tier
# rewards    entries in the same format as quests.yml. Extra here:
#              item: [A, B, C]   a random one of these items each time
#              tool: RANDOM      any tool (pickaxe, axe, shovel, hoe, sword)
#              tool: ARMOR       any armor piece, tool: GEAR either, or a list of them
#              item: BOOK + enchant-levels: 20   a random vanilla enchanted book
#
# Exact enchants (works on item and tool entries, here and in quests.yml):
#   item: [DIAMOND_PICKAXE, DIAMOND_SWORD, IRON_SWORD]
#   enchants: [FORTUNE:3, EFFICIENCY:4, UNBREAKING:3]     all of them on whichever item comes out
#   enchant-count: 2                                      or only 2 of the list, picked at random
#                                                         (1-3 for a range; luck leans to the top)
#   unsafe: true                                          also put on enchants that don't fit
# Levels may go past vanilla (UNBREAKING:4, EFFICIENCY:6). Without unsafe, enchants that can't go
# on the item or clash with one it already has are left out: from the list above a sword gets
# unbreaking only, and enchant-count picks among the ones that fit. On BOOK the enchants are
# stored, so item: BOOK + enchant-count: 1 is one of the listed enchanted books.

