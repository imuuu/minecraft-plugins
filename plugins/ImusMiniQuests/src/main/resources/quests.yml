# Every quest under "quests" becomes a quest panel. The key (lumberjack, ...) is its id:
# /imq give <player> <id>. Renaming a key breaks the panels already handed out.
#
# name          the quest's name, put into item.name-format of config.yml ("MiniQuest - <name>")
# material      the item the panel is made of, a glass pane by default. Quest panels can't be
#               placed, crafted with or used as anything else, whatever the material.
# model         (optional) item model shown instead of the material, e.g. minecraft:oak_sapling
# lore          flavour text. The quest, progress bar, reward list and instructions are added
#               below it (see "lore" in config.yml)
# drop-weight   how often this quest is picked when a panel is put in a chest or dropped.
#               0 = never found, can only be given with /imq give
#
# objective.type      what counts, and what the targets are:
#                     BREAK_BLOCK  blocks broken (crops only when fully grown)
#                     KILL_ENTITY  mobs killed
#                     FISH         items caught with a fishing rod
#                     CRAFT        items crafted, every item of a shift-click counts.
#                                  Avoid targets that can be crafted back and forth
#                                  (iron ingot <-> iron block), or they can be farmed
#                     SMELT        items taken out of a furnace, blast furnace or smoker
#                     ENCHANT      items enchanted at an enchanting table
#                     BREED        animals bred (mob types)
#                     TRADE        items bought from villagers, one per trade
#                     EAT          items eaten or drunk
#                     TAME         animals tamed (mob types)
#                     SHEAR        animals sheared (mob types)
#                     WALK         blocks walked on foot, counted every whole block. Targets are
#                                  the blocks walked on (SAND, #logs...), empty = anywhere
# objective.targets   what counts. Empty or missing = anything.
#                     Blocks/items: OAK_LOG, *_ORE (wildcard), #logs (tag), *
#                     Mobs:         ZOMBIE, *_SPIDER, #skeletons (tag), @hostile, *
# objective.amount    how many are needed (rarer panels need more, see rarities in config.yml)
# objective.time-limit  (optional) seconds to do the whole amount in. The clock starts with the
#                     first progress; when it runs out the count starts over. Hard, so give
#                     these better rewards
# objective.text      (optional) what the lore says, default is generated from the targets.
#                     The amount written in it, or %amount%, follows the panel's rarity
#
# rewards.rolls       how many times the pool is rolled
# rewards.pool        weighted entries, one is picked per roll
# rewards.guaranteed  always given
# A reward entry is one of:
#   item: DIAMOND                 min/max amount, optional name and lore. Gear can also have
#                                 slots / enchant-levels like tool below. item: [A, B] picks one
#                                 enchants: [FORTUNE:3, EFFICIENCY:4]   exact enchants, with
#                                 enchant-count: 2 for a random few (see rewards.yml)
#   tool: PICKAXE                 one tool, its tier rolled from "tiers" (weights). Default
#                                 tiers: WOODEN 40, STONE 30, IRON 20, GOLDEN 5, DIAMOND 5
#                                 (armor: LEATHER, CHAINMAIL, IRON, GOLDEN, DIAMOND).
#                                 Tools: PICKAXE, AXE, SHOVEL, HOE, SWORD, HELMET, CHESTPLATE,
#                                 LEGGINGS, BOOTS...
#                                 slots: true          comes with ImusEnchants slots
#                                 enchant-levels: 20   vanilla enchants, like an enchanting table
#   enchant-book: random          ImusEnchants custom enchant book, or an enchant key such as
#                                 timber, vein_miner, beheading. Optional level (default 1)
#   slot-core: true               ImusEnchants Slot Core, min/max amount
#   money: 3-10%                  money, a share of the server's economy (see "money" in
#                                 config.yml), or a fixed amount: money: 500 / money: 200-500
# and every entry can also have:
#   commands                      console commands, %player% = the player's name
#   message                       sent to the player when this entry is given
#   display                       text in the panel's reward list (replaces the generated one)
#   weight                        only in the pool, default 1

