name: ImusMiniQuests
version: '${project.version}'
main: me.imu.imusminiquests.ImusMiniQuests
api-version: '26.2'
authors: [ imukuppikorvaa ]
description: Quest items that fill up as you play (break 100 logs, kill 100 mobs...) and open into rewards
depend:
  - imusAPI
softdepend:
  - BetterStructures
  - ImusEnchants
  - ImusChallenges
permissions:
  imq.points:
    description: See your own quest points and luck with /imq points
    default: true
  imq.points.others:
    description: See and set other players' quest points
    default: op
  imq.unlocks:
    description: See which quest rewards the server has unlocked with /imq unlocks
    default: op
  imq.unlocks.admin:
    description: Unlock or lock quest rewards by hand
    default: op
  imq.unlocks.exempt:
    description: Getting netherite, elytra, mending... never unlocks them for quest rewards (admins)
    default: op
commands:
  imusminiquests:
    description: ImusMiniQuests
    usage: /<command>
    aliases:
      - imq
