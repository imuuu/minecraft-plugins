name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Check plugin.yml files
        run: |
          pip install -q pyyaml
          python3 .github/scripts/check_plugin_yml.py

      # paper-api and VaultAPI come from the repositories in pom.xml. BetterStructures isn't
      # published anywhere, so a compile-only stub of the classes the plugins use is installed
      # under the coordinates the POM expects.
      - name: Install BetterStructures stub
        run: |
          BS_VERSION=$(mvn -B -q help:evaluate -Dexpression=betterstructures.version -DforceStdout -N)
          mvn -B -q dependency:build-classpath -N -Dmdep.outputFile=paper-cp.txt
          mkdir -p ci-libs/stub-classes
          javac --release 25 -cp "$(cat paper-cp.txt)" -d ci-libs/stub-classes $(find .github/ci-stubs/betterstructures -name "*.java")
          jar cf ci-libs/BetterStructures.jar -C ci-libs/stub-classes .
          mvn -B -q install:install-file -Dfile=ci-libs/BetterStructures.jar -DgroupId=com.magmaguy -DartifactId=BetterStructures -Dversion=$BS_VERSION -Dpackaging=jar

      - name: Build
        run: mvn -B package

      # <name>.jar and <name>-<version>-shaded.jar are the same jar; keep only the first
      - name: Collect jars
        run: |
          mkdir -p dist
          find libs plugins -path "*/target/*.jar" ! -name "original-*.jar" ! -name "*-shaded.jar" -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: dist/*.jar
          retention-days: 30

      # server/start.bat downloads these before starting the server. The release is recreated
      # on every push to main so the "latest" tag always points at the commit that was built.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -q ../plugins.zip *.jar)
          echo "$GITHUB_SHA" > version.txt
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest plugins.zip version.txt \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Plugin jars built from $GITHUB_SHA. Updated on every push to main."
